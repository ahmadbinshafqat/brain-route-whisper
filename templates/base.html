<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Route Whisper{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQoz9tMFcxGYg2ZbCT1N9Bf5u0w+eI=" crossorigin="">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/">Route Whisper</a>
    <span class="tagline">Lightweight walking-route planning</span>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
{% block scripts %}{% endblock %}
</body>
</html>
